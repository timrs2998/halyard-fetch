name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same ref makes the in-flight run obsolete. Cancelling it
# frees the runner immediately instead of queueing behind work nobody wants.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm test
